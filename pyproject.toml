[project]
name = "typewing"
version = "0.0.1"
description = "Type-safe Ibis table extensions with SQLModel-like interface"
readme = "README.md"
authors = [
    { name = "Daniel Mesejo", email = "mesejoleon@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "ibis-framework>=11.0.0",
    "sqlglot>=23.4,<28,!=26.32.0",
]

[project.optional-dependencies]
dev = [
    "pre-commit>=4.4.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.14.6",
    "ibis-framework[duckdb]>=11.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff.lint]
extend-select = ["I", "ICN"]

[tool.ruff.lint.isort]
known-first-party = ["typewing"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]
lines-after-imports = 2

[tool.codespell]
skip = "*.lock,.direnv,.git,docs/_freeze/**/html.json"
ignore-regex = '\b(DOUB|i[if]f|I[IF]F|lamduh|AFE|crate|ba)\b'
builtin = "clear,rare,names"
